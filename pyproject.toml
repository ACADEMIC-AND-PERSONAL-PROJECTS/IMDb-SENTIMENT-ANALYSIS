description = "Add your description here"
readme = "README.md"
authors = [
    { name = "khadimmbaye0", email = "khadimmbaye4002@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.1.0",
    "datasets>=5.2.0",
    "fastapi>=0.162.5",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "torch>=2.15.0",
    "transformers>=5.22.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
imdb-sentiment-analysis = "imdb_sentiment_analysis:main"

[build-system]
