name: cinescope

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: cinescope-backend:latest
    container_name: cinescope-backend
    environment:
      MODEL_PATH: /app/models/imdb_bert
      MAX_LENGTH: "256"
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
      LOG_LEVEL: INFO
    ports:
      - "${BACKEND_PORT:-8088}:8088"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=4)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
    restart: unless-stopped
    networks:
      - cinescope

  frontend:
    build:
      context: ./frontend
    image: cinescope-frontend:latest
    container_name: cinescope-frontend
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - cinescope

networks:
  cinescope:
    driver: bridge
