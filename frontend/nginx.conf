server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Same-origin API: /api/predict -> backend:8088/predict
    location /api/ {
        proxy_pass http://backend:8088/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
    }

    # FastAPI's interactive docs live at root paths, so expose them here too.
    location = /docs {
        proxy_pass http://backend:8088/docs;
        proxy_set_header Host $host;
    }

    location = /redoc {
        proxy_pass http://backend:8088/redoc;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://backend:8088/openapi.json;
        proxy_set_header Host $host;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # This app has no service worker. Never let the SPA fallback answer a
    # service-worker URL with HTML: a stale worker from a previous app on
    # the same origin can otherwise keep control of localhost:3000.
    location = /sw.js {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
